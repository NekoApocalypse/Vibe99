name: Windows SignPath onboarding

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect an unsigned MSI, or request production signing after onboarding'
        type: choice
        options: [inspect, sign]
        default: inspect
        required: true

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.repository == 'NekoApocalypse/Vibe99'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version, origin, and signing configuration
        id: release
        env:
          MODE: ${{ inputs.mode }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_CERTIFICATE_SUBJECT: ${{ vars.SIGNPATH_CERTIFICATE_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable versions are supported' }
          if ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version -cne $version) {
            throw 'Tauri and package versions differ'
          }
          if ($env:MODE -eq 'sign') {
            if ($env:GITHUB_REF -cne "refs/tags/v$version") { throw 'Production signing must run on the matching version tag' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release commit must be on main' }
            foreach ($name in @('SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG','SIGNPATH_CERTIFICATE_SUBJECT')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name; complete SignPath onboarding first" }
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri:build -- --bundles msi --ci
      - name: Inspect unsigned installer and stage the exact artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "src-tauri/target/release/bundle/msi/Vibe99_$($env:VERSION)_x64_en-US.msi"
          ./scripts/signpath/verify-msi.ps1 -MsiPath $msi -Version $env:VERSION -InspectUnsigned
          New-Item -ItemType Directory -Path signpath-unsigned | Out-Null
          Copy-Item -LiteralPath $msi -Destination signpath-unsigned
      - name: Upload unsigned MSI for SignPath origin verification
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-msi
          path: signpath-unsigned/*.msi
          if-no-files-found: error
          retention-days: 7
      - name: Request signing (maintainer must approve in SignPath)
        if: inputs.mode == 'sign'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-signed
          parameters: |
            version: "${{ steps.release.outputs.version }}"
      - name: Verify installer and embedded application signatures
        if: inputs.mode == 'sign'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SUBJECT: ${{ vars.SIGNPATH_CERTIFICATE_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "signpath-signed/Vibe99_$($env:VERSION)_x64_en-US.msi"
          ./scripts/signpath/verify-msi.ps1 -MsiPath $msi -Version $env:VERSION -ExpectedSignerSubject $env:EXPECTED_SUBJECT | Set-Content signpath-signed/verification.json
      - name: Upload verified signed MSI for review
        if: inputs.mode == 'sign'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-signed-windows-msi
          path: |
            signpath-signed/*.msi
            signpath-signed/verification.json
          if-no-files-found: error
